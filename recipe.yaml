$engine: 3
$onesync: on

name: FiveM Enhanced Qbox Roleplay Server
version: development
author: Artex3428
description: Open-source FiveM Enhanced Qbox roleplay server project.

tasks:

  # ---------------------------------------------------------
  # Database
  # ---------------------------------------------------------

  - action: connect_database

  # ---------------------------------------------------------
  # Download complete server-data package
  # ---------------------------------------------------------

  - action: download_file
    url: https://github.com/Artex3428/fivem-server-project/releases/download/txadmin-dev/txadmin-base.zip
    path: ./tmp/txadmin-base.zip
    timeoutSeconds: 1200

  - action: unzip
    src: ./tmp/txadmin-base.zip
    dest: ./
    timeoutSeconds: 1200

  - action: download_file
    url: https://github.com/Artex3428/fivem-server-project/releases/download/txadmin-dev/txadmin-resources-01.zip
    path: ./tmp/txadmin-resources-01.zip
    timeoutSeconds: 1200

  - action: unzip
    src: ./tmp/txadmin-resources-01.zip
    dest: ./
    timeoutSeconds: 1200

  - action: download_file
    url: https://github.com/Artex3428/fivem-server-project/releases/download/txadmin-dev/txadmin-resources-02.zip
    path: ./tmp/txadmin-resources-02.zip
    timeoutSeconds: 1200

  - action: unzip
    src: ./tmp/txadmin-resources-02.zip
    dest: ./
    timeoutSeconds: 1200

  - action: download_file
    url: https://github.com/Artex3428/fivem-server-project/releases/download/txadmin-dev/txadmin-resources-03.zip
    path: ./tmp/txadmin-resources-03.zip
    timeoutSeconds: 1200

  - action: unzip
    src: ./tmp/txadmin-resources-03.zip
    dest: ./
    timeoutSeconds: 1200

  - action: download_file
    url: https://github.com/Artex3428/fivem-server-project/releases/download/txadmin-dev/txadmin-resources-04.zip
    path: ./tmp/txadmin-resources-04.zip
    timeoutSeconds: 1200

  - action: unzip
    src: ./tmp/txadmin-resources-04.zip
    dest: ./
    timeoutSeconds: 1200

  - action: download_file
    url: https://github.com/Artex3428/fivem-server-project/releases/download/txadmin-dev/txadmin-resources-05.zip
    path: ./tmp/txadmin-resources-05.zip
    timeoutSeconds: 1200

  - action: unzip
    src: ./tmp/txadmin-resources-05.zip
    dest: ./
    timeoutSeconds: 1200

  - action: download_file
    url: https://github.com/Artex3428/fivem-server-project/releases/download/txadmin-dev/txadmin-resources-06.zip
    path: ./tmp/txadmin-resources-06.zip
    timeoutSeconds: 1200

  - action: unzip
    src: ./tmp/txadmin-resources-06.zip
    dest: ./
    timeoutSeconds: 1200

  - action: download_file
    url: https://github.com/Artex3428/fivem-server-project/releases/download/txadmin-dev/txadmin-resources-07.zip
    path: ./tmp/txadmin-resources-07.zip
    timeoutSeconds: 1200

  - action: unzip
    src: ./tmp/txadmin-resources-07.zip
    dest: ./
    timeoutSeconds: 1200

  - action: download_file
    url: https://github.com/Artex3428/fivem-server-project/releases/download/txadmin-dev/txadmin-resources-08.zip
    path: ./tmp/txadmin-resources-08.zip
    timeoutSeconds: 1200

  - action: unzip
    src: ./tmp/txadmin-resources-08.zip
    dest: ./
    timeoutSeconds: 1200

  - action: download_file
    url: https://github.com/Artex3428/fivem-server-project/releases/download/txadmin-dev/txadmin-resources-09.zip
    path: ./tmp/txadmin-resources-09.zip
    timeoutSeconds: 1200

  - action: unzip
    src: ./tmp/txadmin-resources-09.zip
    dest: ./
    timeoutSeconds: 1200

  - action: download_file
    url: https://github.com/Artex3428/fivem-server-project/releases/download/txadmin-dev/txadmin-resources-10.zip
    path: ./tmp/txadmin-resources-10.zip
