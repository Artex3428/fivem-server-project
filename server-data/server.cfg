# Only change the IP if you're using a server with multiple network interfaces, otherwise change the port only.
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# These resources will start by default.
ensure mapmanager
ensure chat
ensure spawnmanager
ensure oxmysql
ensure ox_lib
ensure qbx_core
ensure ox_target
ensure ps-adminmenu
ensure illenium-appearance
ensure sd-zonecreator
ensure MugShotBase64
ensure fivem-freecam
ensure qbx_idcard
ensure qbx_hud
ensure sd-levels
ensure ox_inventory
ensure Renewed-Banking
ensure ox_fuel
ensure ox_doorlock
ensure ps-realtor
ensure ps-housing
ensure sd-cases
ensure sd-itemspawner
ensure sd-phone-props
ensure sd-tablet-props
ensure sd-phone
ensure sd-tablet
ensure sd-policeradar
ensure sd-dialog
ensure sd-selfstorage
ensure qbx_vehicles
ensure qbx_garages
ensure qbx_vehiclekeys
ensure qbx_vehicleshop
ensure qbx_vehiclesales

# This allows players to use scripthook-based plugins such as the legacy Lambda Menu.
# Set this to 1 to allow scripthook. Do note that this does _not_ guarantee players won't be able to use external plugins.
sv_scriptHookAllowed 0

# A comma-separated list of tags for your server.
# For example:
# - sets tags "drifting, cars, racing"
# Or:
# - sets tags "roleplay, military, tanks"
sets tags "default"

# A valid locale identifier for your server's primary language.
# For example "en-US", "fr-CA", "nl-NL", "de-DE", "en-GB", "pt-BR"
sets locale "root-AQ" 
# please DO replace root-AQ on the line ABOVE with a real language! :)

# Set an optional server info and connecting banner image url.
# Size doesn't matter, any banner sized image will be fine.
#sets banner_detail "https://url.to/image.png"
#sets banner_connecting "https://url.to/image.png"

# Set your server's hostname. This is not usually shown anywhere in listings.
sv_hostname "FXServer, but unconfigured"

# Set your server's Project Name
sets sv_projectName "My FXServer Project"

# Set your server's Project Description
sets sv_projectDesc "Default FXServer requiring configuration"

# Set Game Build (https://docs.fivem.net/docs/server-manual/server-commands/#sv_enforcegamebuild-build)
# sv_enforceGameBuild 1

# Nested configs!
exec server-config.cfg

# Loading a server icon (96x96 PNG file)
#load_server_icon myLogo.png

# convars which can be used in scripts
set temp_convar "hey world!"

# Remove the `#` from the below line if you want your server to be listed as 'private' in the server browser.
# Do not edit it if you *do not* want your server listed as 'private'.
# Check the following url for more detailed information about this:
# https://docs.fivem.net/docs/server-manual/server-commands/#sv_master1-newvalue
#sv_master1 ""

# Add system admins
add_ace group.admin command allow # allow all commands
add_ace group.admin command.quit deny # but don't allow quit

# enable OneSync (required for server-side state awareness)
set onesync on

# Server player slot limit (see https://fivem.net/server-hosting for limits)
sv_maxclients 48



## SCRIPTS CONFIG ##
setr qb_locale "en"

# QB compatibility bridge
setr qbx:enableBridge "true"

# Qbox queue
set qbx:enableQueue "true"

set qbx:bucketLockdownMode "inactive"

set qbx:max_jobs_per_player 1
set qbx:max_gangs_per_player 1

set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "true"

set qbx:allowMethodOverrides "true"
set qbx:disableOverrideWarning "false"

# Leave persistence off until vehicle systems are fully configured
setr qbx:enableVehiclePersistence "false"
setr qbx:vehiclePersistenceType "semi"


# ============================================
# OX LIB
# ============================================

setr ox:locale "en"

setr ox:primaryColor blue
setr ox:primaryShade 8

# Don't let players change language themselves for now
setr ox:userLocales 0

add_ace resource.ox_lib command.add_ace allow
add_ace resource.ox_lib command.remove_ace allow
add_ace resource.ox_lib command.add_principal allow
add_ace resource.ox_lib command.remove_principal allow

# ============================================
# OX TARGET
# ============================================

# Hold Alt rather than toggle
setr ox_target:toggleHotkey 0

# Left Alt
setr ox_target:defaultHotkey LMENU

setr ox_target:drawSprite 1
setr ox_target:defaults 1

# Keep debugging disabled normally
setr ox_target:debug 0

# Samuel target supports left-click selection
setr ox_target:leftClick 1


# ============================================
# OX INVENTORY
# ============================================

# VERY IMPORTANT for Qbox
setr inventory:framework "qbx"

# Use ox_target integration
setr inventory:target true

setr inventory:slots 50

# 85 kg
setr inventory:weight 85000

setr inventory:police ["police"]

setr inventory:imagepath "nui://ox_inventory/web/images"

setr inventory:autoreload false
setr inventory:screenblur true

setr inventory:keys ["TAB", "K", "F1"]

setr inventory:giveplayerlist true
setr inventory:weaponanims true
setr inventory:itemnotify true
setr inventory:weaponnotify true

setr inventory:aimedfiring false
setr inventory:suppresspickups 1

# Cash represented through inventory
set inventory:accounts ["money"]

# Version checking
set inventory:versioncheck true

# Standard logging for now
set inventory:loglevel 1

# Illenium-appearance
setr illenium-appearance:locale "en"