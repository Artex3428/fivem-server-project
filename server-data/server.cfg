# This allows players to use scripthook-based plugins such as the legacy Lambda Menu.
# Set this to 1 to allow scripthook. Do note that this does _not_ guarantee players won't be able to use external plugins.
sv_scriptHookAllowed 0

# A comma-separated list of tags for your server.
# For example:
# - sets tags "drifting, cars, racing"
# Or:
# - sets tags "roleplay, military, tanks"
sets tags "default"

# A valid locale identifier for your server's primary language.
# For example "en-US", "fr-CA", "nl-NL", "de-DE", "en-GB", "pt-BR"
sets locale "root-AQ" 
# please DO replace root-AQ on the line ABOVE with a real language! :)

# Set an optional server info and connecting banner image url.
# Size doesn't matter, any banner sized image will be fine.
#sets banner_detail "https://url.to/image.png"
#sets banner_connecting "https://url.to/image.png"

# Set your server's hostname. This is not usually shown anywhere in listings.
sv_hostname "FXServer, but unconfigured"

# Set your server's Project Name
sets sv_projectName "My FXServer Project"

# Set your server's Project Description
sets sv_projectDesc "Default FXServer requiring configuration"

# Set Game Build (https://docs.fivem.net/docs/server-manual/server-commands/#sv_enforcegamebuild-build)
# sv_enforceGameBuild 1

# Loading a server icon (96x96 PNG file)
#load_server_icon myLogo.png

# convars which can be used in scripts
set temp_convar "hey world!"

# Remove the `#` from the below line if you want your server to be listed as 'private' in the server browser.
# Do not edit it if you *do not* want your server listed as 'private'.
# Check the following url for more detailed information about this:
# https://docs.fivem.net/docs/server-manual/server-commands/#sv_master1-newvalue
#sv_master1 ""

# Add system admins
add_ace group.admin command allow # allow all commands
add_ace group.admin command.quit deny # but don't allow quit
add_ace group.admin admin allow

# Allow Qbox / ox_lib to manage ACEs
add_ace resource.qbx_core command allow
add_ace resource.ox_lib command.add_ace allow
add_ace resource.ox_lib command.remove_ace allow
add_ace resource.ox_lib command.add_principal allow
add_ace resource.ox_lib command.remove_principal allow

# Nested configs!
exec server-private.cfg

# enable OneSync (required for server-side state awareness)
set onesync on

# Server player slot limit (see https://fivem.net/server-hosting for limits)
sv_maxclients 48



## SCRIPTS CONFIG ##

# At least for qbx_truckerjob
set qbx:acknowledge "true"

setr UseTarget "true"

setr qb_locale "en"

# QB compatibility bridge
setr qbx:enableBridge "true"

# Qbox queue
set qbx:enableQueue "true"

set qbx:bucketLockdownMode "inactive"

set qbx:max_jobs_per_player 1
set qbx:max_gangs_per_player 1

set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "true"

set qbx:allowMethodOverrides "true"
set qbx:disableOverrideWarning "false"

# Leave persistence off until vehicle systems are fully configured
setr qbx:enableVehiclePersistence "false"
setr qbx:vehiclePersistenceType "semi"

# For qbx_management i guess
set qbx:enableGroupManagement "true"


# ============================================
# OX LIB
# ============================================

setr ox:locale "en"

setr ox:primaryColor blue
setr ox:primaryShade 8

# Don't let players change language themselves for now
setr ox:userLocales 0

add_ace resource.ox_lib command.add_ace allow
add_ace resource.ox_lib command.remove_ace allow
add_ace resource.ox_lib command.add_principal allow
add_ace resource.ox_lib command.remove_principal allow

# ============================================
# OX TARGET
# ============================================

# Hold Alt rather than toggle
setr ox_target:toggleHotkey 0

# Left Alt
setr ox_target:defaultHotkey LMENU

setr ox_target:drawSprite 1
setr ox_target:defaults 1

# Keep debugging disabled normally
setr ox_target:debug 0

# Samuel target supports left-click selection
setr ox_target:leftClick 1


# ============================================
# OX INVENTORY
# ============================================

# VERY IMPORTANT for Qbox
setr inventory:framework "qbx"

# Use ox_target integration
setr inventory:target true

setr inventory:slots 50

# 85 kg
setr inventory:weight 85000

setr inventory:police ["police"]

setr inventory:imagepath "nui://ox_inventory/web/images"

setr inventory:autoreload false
setr inventory:screenblur true

setr inventory:keys ["TAB", "K", "F1"]

setr inventory:giveplayerlist true
setr inventory:weaponanims true
setr inventory:itemnotify true
setr inventory:weaponnotify true

setr inventory:aimedfiring false
setr inventory:suppresspickups 1

# Cash represented through inventory
set inventory:accounts ["money"]

# Version checking
set inventory:versioncheck true

# Standard logging for now
set inventory:loglevel 1

# Illenium-appearance
setr illenium-appearance:locale "en"



#### LOADSCREEN ####

# Whether to let other resources handle the loadscreen shutdown.
setr loadscreen:externalShutdown false

# The style to load for the screen (classic, modern, minimal).
# Custom styles may be added in `@loadscreen/html/styles`.
set loadscreen:style "minimal"

# The background to use for the screen ("image", "video", "embed", or a css background).
# CSS background example: "linear-gradient(-15deg, rgb(5, 0, 7.5) 0%, rgb(15, 10, 25) 100%)"
# Custom images may be added in `@loadscreen/html/assets/images`.
# Custom videos may be added in `@loadscreen/html/assets/videos`.
# An embed may be specified with the `loadscreen:embedLink` convar.
# If your custom video isn't working, try to convert it to different codecs & formats (such as webm).
set loadscreen:background "image"

# The brightness to use for the background (percentage).
set loadscreen:backgroundBrightness 30

# The text color to use for the screen (a css color).
set loadscreen:textColor "rgb(250, 250, 250)"

# The primary color to use for the screen (a css color).
# Used for the loading bars.
set loadscreen:primaryColor "rgb(64, 64, 255)"

# The secondary color to use for the screen (a css color).
# Used for the audio controls & error log borders, and part of the audio volume slider.
set loadscreen:secondaryColor "rgb(64, 64, 64)"

# The shadow color to use for the screen (a css color).
# Used for the loading bars and audio controls.
set loadscreen:shadowColor "rgba(8, 8, 16, 0.5)"

# The font family to use for the screen (a css font-family).
set loadscreen:fontFamily "'Segoe UI', Arial, Helvetica, sans-serif"

# Whether to show a logo along with the server message.
# A logo may be added in `@loadscreen/html/assets`.
# The image should be named `logo`, with a web-supported image extension.
set loadscreen:logo true

# The message displayed when loading.
# Available variables:
# ${playerName} - Player name
# ${serverName} - sv_projectName variable, or sv_hostname if not available
set loadscreen:serverMessage "${playerName}, welcome to ${serverName}!"

# Whether to show the primary loading bar.
set loadscreen:primaryBar true

# Whether to show the secondary loading bar.
set loadscreen:secondaryBar false

# Whether to show the current loading action near the secondary bar (such as `INIT_FUNCTION`).
set loadscreen:loadingAction false

# The message displayed when the game is awaiting scripts.
set loadscreen:finishingMessage "Finishing up..."

# Whether to show the current log line along with the finishing message (such as `Awaiting Scripts`).
set loadscreen:logLine true

# The message displayed when the game is done loading, but another resource has to shut down the screen (when `loadscreen:externalShutdown` is true).
set loadscreen:finishedMessage "Done!"

# Additional text displayed when the game is done loading, but another resource has to shut down the screen (when `loadscreen:externalShutdown` is true).
set loadscreen:finishedLine "You will be loaded in any moment now..."

# Whether to show audio controls when background music and/or video is available (recommended).
set loadscreen:audioControls true

# The key to use for muting/unmuting audio.
set loadscreen:audioMuteKey "Space"

# Whether to remember the audio volume set by the player, if the audio controls are enabled. (recommended).
set loadscreen:rememberVolume true

# Whether to show an error log when an error occurs in the NUI (recommended).
set loadscreen:errorLog true

# The initial volume for the background audio - music & video (0 - 100).
set loadscreen:initialAudioVolume 10

# Whether music should be enabled for the screen.
# Custom music may be added in `@loadscreen/html/assets/music`.
set loadscreen:music true

# Whether music should be randomly shuffled when played.
set loadscreen:musicShuffle false

# The rate at which images are switched in milliseconds.
set loadscreen:imageRate 7500

# Whether images should be randomly shuffled when displayed.
set loadscreen:imageShuffle false

# Whether videos should be randomly shuffled when displayed.
set loadscreen:videoShuffle false

# An embed link to play in the background if `loadscreen:background` is set to "embed".
set loadscreen:embedLink "https://www.youtube.com/embed?playlist=E49ureeMykI&autoplay=1&loop=1"

# Whether to enable mouse clicks for the background embed.
set loadscreen:embedAccess true


## Scully emotemenu
setr scully_emotemenu:menuPosition "top-right" # Can be "top-left", "top-right", "bottom-left" or "bottom-right".
setr scully_emotemenu:menuCommands ["em", "emotemenu"] # Commands to open the menu.
setr scully_emotemenu:menuKeybind "F5" # Set this to "" to disable the key.
setr scully_emotemenu:enableRadialMenu "true" # You can disable the radial menu options here.
setr scully_emotemenu:enableEmotePreview "true" # You can disable emote previews here.
setr scully_emotemenu:enableEmoteBinds "true" # You can disable the emote binds here.
setr scully_emotemenu:emoteCommands ["e", "emote", "eplay"] # Commands to play an emote.
setr scully_emotemenu:emoteCancelKey "X" # Set this to "" to disable the key.
setr scully_emotemenu:walkCommands ["w", "walk"] # Commands to set a walk style.
setr scully_emotemenu:expressionCommands ["f", "face"] # Commands to start a scenario.
setr scully_emotemenu:preventWalkStyleAbuse "true" # You can disable this to use the walkstyles run animation.
setr scully_emotemenu:enableNSFWEmotes "false" # You can enable the NSFW emotes here. Can be "true", "false" or "limited"
setr scully_emotemenu:enableGangEmotes "false" # You can enable the gang emotes here.
setr scully_emotemenu:enableSocialMovementEmotes "false" # You can enable the social movement emotes here.
setr scully_emotemenu:enableConsumableEmotes "false" # You can enable the consumable emotes here.
setr scully_emotemenu:enableSynchronizedEmotes "false" # You can enable the synchronized emotes here.
setr scully_emotemenu:enableAnimalEmotes "false" # You can enable the animal emotes here.
setr scully_emotemenu:enableWeaponBlock "false" # You can enable this to block players from using weapons while doing an emote.
setr scully_emotemenu:enableAimShootBlock "true" # You can disable this to allow players to aim and shoot while doing an emote.
setr scully_emotemenu:enableEmotesInVehicles "true" # You can disable this to block players from doing emotes inside vehicles.
setr scully_emotemenu:emoteCooldown 500 # Cooldown in milliseconds between doing emotes
setr scully_emotemenu:enableEmotePlacement "true" # You can disable the emote position selector on emotes with the Placement flag here.
setr scully_emotemenu:enableAutoPtfx "true" # You can disable automated ptfx on emotes with the Auto flag here.
setr scully_emotemenu:ptfxKey "G" # Set this to "" to disable the key.
setr scully_emotemenu:pointKey "B" # Set this to "" to disable the key.