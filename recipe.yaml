    dest: ./
    timeoutSeconds: 1200

  - action: download_file
    url: https://github.com/Artex3428/fivem-server-project/releases/download/txadmin-dev/txadmin-resources-11.zip
    path: ./tmp/txadmin-resources-11.zip
    timeoutSeconds: 1200

  - action: unzip
    src: ./tmp/txadmin-resources-11.zip
    dest: ./
    timeoutSeconds: 1200

  - action: download_file
    url: https://github.com/Artex3428/fivem-server-project/releases/download/txadmin-dev/txadmin-resources-12.zip
    path: ./tmp/txadmin-resources-12.zip
    timeoutSeconds: 1200

  - action: unzip
    src: ./tmp/txadmin-resources-12.zip
    dest: ./
    timeoutSeconds: 1200

  # ---------------------------------------------------------
  # Database setup
  # ---------------------------------------------------------

  - action: query_database
    file: ./install.sql
    timeoutSeconds: 1200

  # ---------------------------------------------------------
  # txAdmin server configuration
  # ---------------------------------------------------------

  - action: replace_string
    file: ./server.cfg
    search: 'endpoint_add_tcp "0.0.0.0:30120"'
    replace: '{{serverEndpoints}}'

  - action: replace_string
    file: ./server.cfg
    search: 'endpoint_add_udp "0.0.0.0:30120"'
    replace: ''

  - action: replace_string
    file: ./server.cfg
    search: 'sv_maxclients 48'
    replace: 'sv_maxclients {{maxClients}}'

  - action: replace_string
    file: ./server.cfg
    search: 'sv_hostname "Unnamed server"'
    replace: 'sv_hostname "{{serverName}}"'

  - action: replace_string
    file: ./server.cfg
    search: 'sets sv_projectName "Server project"'
    replace: 'sets sv_projectName "{{serverName}}"'

  # ---------------------------------------------------------
  # Private configuration
  # ---------------------------------------------------------

  - action: write_file
    file: ./server-private.cfg
    data: |
      # Generated automatically by the txAdmin recipe.
      # Keep this file private.

      sv_licenseKey "{{svLicense}}"

      set steam_webApiKey ""

      set mysql_connection_string "{{dbConnectionString}}"

      # Initial txAdmin server owner
      {{addPrincipalsMaster}}

  - action: replace_string
    mode: all_vars
    file: ./server-private.cfg

  # ---------------------------------------------------------
  # Cleanup installation files
  # ---------------------------------------------------------

  - action: remove_path
    path: ./tmp